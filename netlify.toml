[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20.19.5"

# Fingerprinted framework assets are safe to retain indefinitely at the CDN.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/cormorant-garamond-ae1ccee3fa8d.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
